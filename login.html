<html lang="fa" dir="rtl">

<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>


<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap" rel="stylesheet">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


</head>



<body>


<div class="loginPage">



<div class="cardBox loginBox">



<div class="cardIcon">

<i class="fa-solid fa-bullhorn"></i>

</div>



<h1 class="textCenter">

تبلیغینو

</h1>


<p class="cardText textCenter">

به حساب کاربری خود وارد شوید

</p>





<div class="inputGroup">


<i class="fa-solid fa-envelope"></i>


<input

type="email"

id="email"

placeholder="ایمیل">


</div>





<div class="inputGroup">


<i class="fa-solid fa-lock"></i>


<input

type="password"

id="password"

placeholder="رمز عبور">


<i

class="fa-solid fa-eye togglePassword"

onclick="togglePassword()">

</i>


</div>





<button

id="loginBtn"

class="primaryBtn">


<i class="fa-solid fa-right-to-bracket"></i>

ورود


</button>





<button

class="secondaryBtn"

onclick="location.href='index.html'">


<i class="fa-solid fa-house"></i>

بازگشت به صفحه اصلی


</button>







<div class="textCenter mt20">


<a href="register.html">

حساب ندارید؟ ثبت نام

</a>


</div>







<div class="infoBox mt20">


<p>

<i class="fa-solid fa-circle-check"></i>

ثبت سفارش تبلیغات

</p>



<p>

<i class="fa-solid fa-circle-check"></i>

کسب درآمد از تبلیغات

</p>



<p>

<i class="fa-solid fa-circle-check"></i>

پرداخت امن و سریع

</p>


</div>





</div>



</div>







<script>


function togglePassword(){


const input=document.getElementById("password");

const eye=document.querySelector(".togglePassword");



if(input.type==="password"){


input.type="text";


eye.classList.remove("fa-eye");

eye.classList.add("fa-eye-slash");


}else{


input.type="password";


eye.classList.remove("fa-eye-slash");

eye.classList.add("fa-eye");


}


}


</script>





<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="assets/js/supabase.js"></script>

<script src="assets/js/auth.js"></script>
