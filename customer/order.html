<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>ثبت سفارش تبلیغات | تبلیغینو</title>

<link rel="stylesheet" href="../assets/css/style2.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>


<div class="dashboard">


<div id="sidebar"></div>


<main class="content">


<div id="header"></div>



<section class="dashboardSection">


<div class="cardBox">


<button
class="btn secondary"
onclick="history.back()">

<i class="fa-solid fa-arrow-right"></i>

بازگشت

</button>


<br><br>



<h2>

📢 ثبت سفارش تبلیغات

</h2>



<br>



<div id="pageInfoBox" class="infoBox">

در حال دریافت اطلاعات پیج...

</div>



<br>



<div class="infoBox">


<h3>

📌 راهنمای سفارش

</h3>


<p>

بعد از ثبت سفارش، درخواست شما برای صاحب پیج ارسال می‌شود.

</p>


<p>

زمان انتشار تبلیغ توسط شما پیشنهاد داده می‌شود.

</p>


<p>

شماره تماس برای هماهنگی استفاده خواهد شد.

</p>


</div>



<br>



<h3>

اطلاعات پیج شما

</h3>



<div class="inputGroup">


<label>

آیدی پیج اینستاگرام شما

</label>


<input

id="customerInstagram"

placeholder="@username">

</div>




<div class="inputGroup">


<label>

لینک پیج (اختیاری)

</label>


<input

id="customerLink"

placeholder="https://instagram.com/...">

</div>




<div class="inputGroup">


<label>

تعداد دنبال کننده

</label>


<input

id="customerFollowers"

type="number"

placeholder="مثلا 10000">

</div>




<div class="inputGroup">


<label>

شماره تماس

</label>


<input

id="customerPhone"

placeholder="09xxxxxxxxx">

</div>




<br>



<h3>

نوع تبلیغ

</h3>



<div class="inputGroup">


<select id="service">


<option value="story">

استوری

</option>


<option value="post">

پست

</option>


<option value="reel">

ریلز

</option>


</select>


</div>




<div class="inputGroup">


<label>

تاریخ پیشنهادی انتشار

</label>


<input

id="publishDate"

placeholder="1405/05/20">

</div>




<div class="inputGroup">


<label>

ساعت پیشنهادی انتشار

</label>


<input

id="publishTime"

type="time">

</div>




<div class="inputGroup">


<label>

توضیحات سفارش

</label>


<textarea

id="customerNote"

rows="5"

placeholder="توضیحات خود را بنویسید..."></textarea>


</div>




<br>



<div class="priceCard">


<h3>

💰 مبلغ سفارش:

</h3>


<div id="priceBox">

در حال محاسبه...

</div>


</div>



<br>




<button

class="primaryBtn"

onclick="submitOrder()">


<i class="fa-solid fa-cart-shopping"></i>


ثبت نهایی سفارش


</button>



</div>



</section>



</main>


</div>




<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../assets/js/supabase.js"></script>

<script src="../assets/js/routes.js"></script>

<script src="../assets/js/components.js"></script>

<script src="../assets/js/utils.js"></script>

<script src="js/order.js"></script>



</body>

</html>
