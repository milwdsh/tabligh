<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ثبت نام | تبلیغینو</title>


<link rel="stylesheet" href="assets/css/style2.css">


<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>


<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap" rel="stylesheet">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


</head>


<body>



<div class="loginPage">



<div class="cardBox loginBox">



<div class="cardIcon">

<i class="fa-solid fa-user-plus"></i>

</div>




<h1 class="textCenter">

ثبت نام

</h1>



<p class="cardText textCenter">

حساب کاربری جدید ایجاد کنید

</p>





<div class="inputGroup">

<i class="fa-solid fa-user"></i>

<input

type="text"

id="name"

placeholder="نام و نام خانوادگی">

</div>


<div class="inputGroup">

<i class="fa-solid fa-at"></i>

<input

type="text"

id="username"

placeholder="آیدی کاربری (مثلا user_123)">

</div>



<div class="inputGroup">

<i class="fa-solid fa-envelope"></i>

<input

type="email"

id="email"

placeholder="ایمیل">

</div>






<div class="inputGroup">

<i class="fa-solid fa-lock"></i>


<input

type="password"

id="password"

placeholder="رمز عبور">



<i

class="fa-solid fa-eye togglePassword"

onclick="togglePassword()">

</i>


</div>





<label>

نقش کاربری خود در سایت را انتخاب کنید

</label>



<div class="inputGroup">


<i class="fa-solid fa-users"></i>


<select id="role">


<option value="customer">

👤 مشتری

</option>


<option value="advertiser">

📢 صاحب پیج تبلیغاتی

</option>


</select>


</div>






<button

id="registerBtn"

class="primaryBtn">


<i class="fa-solid fa-user-plus"></i>

ثبت نام


</button>






<button

class="secondaryBtn"

onclick="location.href='index.html'">


<i class="fa-solid fa-house"></i>

بازگشت به صفحه اصلی


</button>








<div class="textCenter mt20">


<a href="login.html">

قبلاً ثبت نام کرده‌اید؟ ورود

</a>


</div>








<div class="infoBox mt20">



<p>

<i class="fa-solid fa-circle-check"></i>

ثبت سفارش تبلیغات

</p>



<p>

<i class="fa-solid fa-circle-check"></i>

درآمد از تبلیغات

</p>



<p>

<i class="fa-solid fa-circle-check"></i>

امن و سریع

</p>




</div>






</div>



</div>








<script>


function togglePassword(){


const input=document.getElementById("password");

const eye=document.querySelector(".togglePassword");



if(input.type==="password"){


input.type="text";


eye.classList.remove("fa-eye");

eye.classList.add("fa-eye-slash");


}else{


input.type="password";


eye.classList.remove("fa-eye-slash");

eye.classList.add("fa-eye");


}


}


</script>






<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="assets/js/supabase.js"></script>

<script src="assets/js/register.js"></script>



</body>

</html>
