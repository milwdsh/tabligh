<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>ویرایش پیج | تبلیغینو</title>

<link rel="stylesheet" href="../assets/css/style.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>


<div class="dashboard">


<div id="sidebar"></div>


<main class="content">


<div id="header"></div>



<div class="pageContent">


<div class="formCard">


<h2 class="formTitle">

ویرایش اطلاعات پیج

</h2>



<div style="text-align:center">


<img id="preview"
class="profileImage"
src="">


</div>



<div class="grid">


<div class="inputGroup">
<label>نام پیج</label>
<input id="page_name">
</div>



<div class="inputGroup">
<label>آیدی اینستاگرام</label>
<input id="instagram_id">
</div>



<div class="inputGroup">
<label>دسته بندی</label>
<input id="category">
</div>



<div class="inputGroup">
<label>فالوور</label>
<input id="followers" type="number">
</div>



<div class="inputGroup">
<label>بازدید استوری</label>
<input id="story_views" type="number">
</div>



<div class="inputGroup">
<label>بازدید ریلز</label>
<input id="reel_views" type="number">
</div>



<div class="inputGroup">
<label>قیمت استوری</label>
<input id="story_price" type="number">
</div>



<div class="inputGroup">
<label>قیمت پست</label>
<input id="post_price" type="number">
</div>



<div class="inputGroup">
<label>قیمت ریلز</label>
<input id="reel_price" type="number">
</div>



<div class="inputGroup">
<label>لینک عکس پروفایل</label>
<input id="profile_image">
</div>


</div>



<div class="inputGroup">

<label>بیو</label>

<textarea id="bio"></textarea>

</div>



<div class="actions">


<button class="saveBtn" onclick="savePage()">

ذخیره تغییرات

</button>



<button class="cancelBtn" onclick="goBack()">

بازگشت

</button>



</div>



</div>


</div>



</main>


</div>





<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../assets/js/supabase.js"></script>
<script src="../assets/js/routes.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/utils.js"></script>


<script src="js/edit-page.js"></script>


</body>

</html>
