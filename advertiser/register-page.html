<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>ثبت پیج تبلیغاتی | تبلیغینو</title>


<link rel="stylesheet" href="../assets/css/style.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


<style>

.formGroup{

margin-bottom:20px;

}


.formGroup label{

display:block;

font-weight:bold;

margin-bottom:8px;

}


.formGroup input,
.formGroup textarea{

width:100%;

padding:12px;

border-radius:10px;

border:1px solid #ddd;

font-family:inherit;

font-size:15px;

}


</style>


</head>


<body>


<div class="dashboard">


<div id="sidebar"></div>


<main class="content">


<div id="header"></div>


<div class="cardBox">


<h2>
ثبت پیج تبلیغاتی
</h2>


<br>


<div class="formGroup">

<label>
نام پیج
</label>

<input id="pageName">

</div>



<div class="formGroup">

<label>
آیدی اینستاگرام
</label>

<input id="instagramId">

</div>



<div class="formGroup">

<label>
دسته بندی پیج
</label>

<input id="category">

</div>



<div class="formGroup">

<label>
تعداد دنبال کننده
</label>

<input id="followers" type="number">

</div>



<div class="formGroup">

<label>
میانگین بازدید استوری
</label>

<input id="storyViews" type="number">

</div>



<div class="formGroup">

<label>
میانگین بازدید ریلز
</label>

<input id="reelViews" type="number">

</div>



<div class="formGroup">

<label>
قیمت تبلیغ استوری (تومان)
</label>

<input id="storyPrice" type="number">

</div>



<div class="formGroup">

<label>
قیمت تبلیغ پست (تومان)
</label>

<input id="postPrice" type="number">

</div>



<div class="formGroup">

<label>
قیمت تبلیغ ریلز (تومان)
</label>

<input id="reelPrice" type="number">

</div>



<div class="formGroup">

<label>
توضیحات پیج
</label>

<textarea id="bio" rows="5"></textarea>

</div>



<button id="savePage" class="btn">

ارسال برای بررسی

</button>



</div>


</main>


</div>




<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../assets/js/supabase.js"></script>

<script src="../assets/js/routes.js"></script>

<script src="../assets/js/components.js"></script>

<script src="../assets/js/utils.js"></script>

<script src="js/register-page.js"></script>


</body>

</html>
