<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پروفایل | تبلیغینو</title>

<link rel="stylesheet" href="assets/css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
    font-family:"Vazirmatn",sans-serif;
    box-sizing:border-box;
}

body{

    margin:0;
    padding:0;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    radial-gradient(circle at top right,#4f46e5 0%,transparent 35%),
    radial-gradient(circle at bottom left,#06b6d4 0%,transparent 30%),
    linear-gradient(135deg,#0f172a,#1e293b);

}

.profilePage{

    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;

}

.profileBox{

    width:100%;
    max-width:430px;

    background:rgba(255,255,255,.08);
    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.12);

    border-radius:25px;

    padding:35px;

    box-shadow:0 15px 45px rgba(0,0,0,.35);

}

.logo{

    width:80px;
    height:80px;

    margin:auto;
    margin-bottom:20px;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:50%;

    background:linear-gradient(135deg,#4f46e5,#06b6d4);

    color:#fff;
    font-size:34px;

}

.profileBox h1{

    text-align:center;
    color:#fff;
    margin:0;

}

.profileBox p{

    text-align:center;
    color:#cbd5e1;

    margin-top:10px;
    margin-bottom:30px;

}

.inputGroup{

    position:relative;
    margin-bottom:18px;

}

.inputGroup i:first-child{

    position:absolute;

    right:18px;
    top:50%;

    transform:translateY(-50%);

    color:#94a3b8;

}

.inputGroup input{

    width:100%;

    padding:14px 50px 14px 50px;

    border:none;
    outline:none;

    border-radius:15px;

    background:#ffffff10;

    color:#fff;

    font-size:15px;

}

.inputGroup input::placeholder{

    color:#cbd5e1;

}

.inputGroup input:disabled{

    opacity:.8;

}

.togglePassword{

    position:absolute;

    left:18px;
    top:50%;

    transform:translateY(-50%);

    cursor:pointer;

    color:#cbd5e1;

}

button{

    width:100%;

    padding:14px;

    border:none;

    border-radius:15px;

    background:linear-gradient(135deg,#4f46e5,#06b6d4);

    color:#fff;

    font-size:15px;
    font-weight:bold;

    cursor:pointer;

    margin-top:5px;

    transition:.25s;

}

button:hover{

    transform:translateY(-2px);

}

.sectionTitle{

    color:#fff;

    font-weight:bold;

    margin:28px 0 15px;

    padding-top:20px;

    border-top:1px solid rgba(255,255,255,.08);

}

</style>

</head>

<body>

<div class="profilePage">

<div class="profileBox">

<button
class="dashboardBtn"
onclick="window.location.href='dashboard.html'">

<i class="fa-solid fa-house"></i>

بازگشت به داشبورد

</button>

<div class="logo">

<i class="fa-solid fa-user"></i>

</div>

<h1>

پروفایل کاربری

</h1>

<p>

اطلاعات حساب خود را مدیریت کنید.

</p>

<label class="groupTitle">

اطلاعات قابل ویرایش

</label>

<div class="inputGroup">

<i class="fa-solid fa-user"></i>

<input
type="text"
id="name"
placeholder="نام">

</div>

<div class="inputGroup">

<i class="fa-solid fa-envelope"></i>

<input
type="email"
id="email"
placeholder="ایمیل">

</div>

<div class="inputGroup">

<i class="fa-solid fa-phone"></i>

<input
type="text"
id="phone"
placeholder="شماره موبایل">

</div>

<button id="saveBtn">

ذخیره اطلاعات

</button>

<div class="sectionTitle">

اطلاعات حساب

</div>

<label>نقش کاربری</label>
<div class="inputGroup disabledGroup">

<i class="fa-solid fa-lock"></i>

<input
type="text"
id="role"
placeholder="نقش"
disabled>

</div>


<label>تاریخ عضویت</label>
<div class="inputGroup disabledGroup">

<i class="fa-solid fa-lock"></i>

<input
type="text"
id="createdAt"
placeholder="تاریخ عضویت"
disabled>

</div>

<div class="sectionTitle">

تغییر رمز عبور

</div>

<div class="inputGroup">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
placeholder="رمز جدید">

<i
class="fa-solid fa-eye togglePassword"
onclick="togglePassword('password',this)">
</i>

</div>

<div class="inputGroup">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password2"
placeholder="تکرار رمز جدید">

<i
class="fa-solid fa-eye togglePassword"
onclick="togglePassword('password2',this)">
</i>

</div>

<button id="passwordBtn">

تغییر رمز عبور

</button>

</div>



</div>

<script>

function togglePassword(id,eye){

    const input=document.getElementById(id);

    if(input.type==="password"){

        input.type="text";

        eye.classList.remove("fa-eye");
        eye.classList.add("fa-eye-slash");

    }else{

        input.type="password";

        eye.classList.remove("fa-eye-slash");
        eye.classList.add("fa-eye");

    }

}

</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/supabase.js"></script>

<script src="assets/js/components.js"></script>

<script src="assets/js/profile.js"></script>

</body>

</html>
