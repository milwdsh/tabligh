<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>بازی دورهمی</title>

<link rel="stylesheet" href="style.css">



</head>


<body>


<div class="app">



<!-- شروع -->

<section id="startScreen" class="screen active">


<h1>🎯 بازی دورهمی</h1>



<label>
تعداد تیم‌ها
</label>

<select id="teamCount">

<option value="2">۲ تیم</option>
<option value="3">۳ تیم</option>
<option value="4">۴ تیم</option>

</select>





<label>
تعداد راندها
</label>


<select id="roundCount">

<option value="1">۱ راند</option>
<option value="2">۲ راند</option>
<option value="3">۳ راند</option>
<option value="5">۵ راند</option>
<option value="10">۱۰ راند</option>

</select>






<label>
زمان هر راند
</label>


<select id="roundTime">

<option value="30">
۳۰ ثانیه
</option>

<option value="60" selected>
۶۰ ثانیه
</option>

<option value="90">
۹۰ ثانیه
</option>

<option value="120">
۱۲۰ ثانیه
</option>

</select>




<button id="setupBtn">
ساخت تیم‌ها
</button>


</section>









<!-- تیم‌ها -->

<section id="teamScreen" class="screen">


<h2>
نام تیم‌ها
</h2>


<div id="teamsContainer"></div>



<button class="backBtn" data-back="startScreen">
⬅ برگشت
</button>


<button id="teamNextBtn">
ادامه
</button>



</section>









<!-- موضوعات -->

<section id="categoryScreen" class="screen">


<h2>
انتخاب موضوع کلمات
</h2>



<div class="categories">


<button class="category" data-category="animals">
🐶 حیوانات
</button>


<button class="category" data-category="food">
🍔 غذا
</button>


<button class="category" data-category="sport">
⚽ ورزش
</button>


<button class="category" data-category="objects">
📦 اشیا
</button>


<button class="category" data-category="iran">
🇮🇷 ایران
</button>


<button class="category" data-category="world">
🌍 جهان
</button>


<button class="category" data-category="movies">
🎬 فیلم
</button>


<button class="category" data-category="jobs">
💼 شغل
</button>



</div>





<button class="backBtn" data-back="teamScreen">
⬅ برگشت
</button>



<button id="startGameBtn">
شروع بازی
</button>



</section>









<!-- بازی -->

<section id="gameScreen" class="screen">



<div class="topBar">


<div id="turnTeam">
تیم
</div>



<div id="roundInfo">
راند ۱
</div>



<div id="timer">
60
</div>


</div>





<div class="card">


<h3>
کلمه را توضیح بده
</h3>


<div id="wordBox">
---
</div>


</div>





<button id="correctBtn">
✅ درست
</button>



<button id="skipBtn">
❌ رد
</button>



</section>









<!-- پایان راند -->

<section id="roundEndScreen" class="screen">


<h2>
🏁 پایان راند
</h2>



<div id="roundScoreBoard">

</div>




<button id="nextRoundBtn">

شروع راند بعدی

</button>



</section>









<!-- نتیجه نهایی -->

<section id="scoreScreen" class="screen">


<h2>
🏆 نتیجه نهایی
</h2>



<div id="scoreBoard">

</div>




<button id="restartBtn">

بازی جدید

</button>



</section>








</div>



<script src="script.js"></script>


</body>


</html>
